<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>최린지</title>
<style>
  :root{
    --ink:#17242e; --sub:#4f6472; --muted:#8496a1;
    --accent:#1d5b8f;
    --soft-2:#edf5f0;
    --paper:#ffffff; --bg:#f6f7f8;
    --hair:#dce3e8; --hair-strong:#c4d0d8;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif;
    color:var(--ink); background:var(--bg); line-height:1.8;
    -webkit-font-smoothing:antialiased; font-size:16px;
  }
  .sheet{ max-width:1000px; margin:0 auto; padding: clamp(28px,6vw,72px); background:var(--paper); }
  .doc-head{ margin:0 0 20px; padding-bottom:16px; border-bottom:2px solid var(--accent); }
  .doc-head .eyebrow{ font-size:14px; font-weight:700; letter-spacing:.4px; color:var(--accent); text-transform:uppercase; }
  .doc-head h1{ margin:8px 0 0; font-size:26px; font-weight:800; letter-spacing:-.4px; }
  .note{ background:var(--soft-2); padding:14px 18px; border-radius:10px; font-size:15px; color:var(--sub); margin:20px 0; }
  .row{ display:flex; align-items:center; gap:18px;
    padding:18px 0; border-bottom:1px solid var(--hair); text-decoration:none; color:inherit; }
  .row:hover .t{ color:var(--accent); }
  .row .t{ font-size:18px; font-weight:700; flex:1; min-width:0; }
  .row .d{ font-size:16px; font-weight:700; color:var(--sub); white-space:nowrap;
    font-variant-numeric:tabular-nums; }
  .row .g{ font-size:15px; color:var(--accent); font-weight:600; white-space:nowrap; }
  footer{ margin-top:30px; padding-top:14px; border-top:1px solid var(--hair);
    font-size:14px; color:var(--muted); }
  @media (max-width:640px){ .sheet{ padding: clamp(18px,5vw,32px); } .row{ flex-wrap:wrap; } }
</style>
</head>
<body>
<div class="sheet">
  <header class="doc-head">
    <div class="eyebrow">iWork수학</div>
    <h1>최린지 학생</h1>
  </header>

  <a class="row" href="2026-08-Unit1-진도계획/index.html">
    <div class="t">2026년 8월 학습 계획서</div>
    <div class="d">2026-08-13</div>
    <span class="g">열기</span>
  </a>
  <a class="row" href="2026-08-학습현황/index.html">
    <div class="t">학습 진행 상황 보고서</div>
    <div class="d">2026-08-12</div>
    <span class="g">열기</span>
  </a>
  <div class="note">비공개 페이지입니다. 검색에 노출되지 않으며, 링크를 받은 분만 보실 수 있습니다.</div>
  <footer>iWork수학 · 제작·편집 원장 이상열 · 무단복제 금지</footer>
</div>
</body>
</html>
